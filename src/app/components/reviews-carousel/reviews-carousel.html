<div
  class="carousel"
  (mouseenter)="pauseAutoplay()"
  (mouseleave)="resumeAutoplay()"
  (focusin)="pauseAutoplay()"
  (focusout)="resumeAutoplay()"
>
  <button
    type="button"
    class="carousel__arrow carousel__arrow--prev"
    aria-label="Previous review"
    (click)="previous()"
  >
    ‹
  </button>

  <div class="carousel__viewport" aria-live="polite" aria-atomic="true">
    @for (review of reviews; track review.quote) {
      @if ($index === activeIndex) {
        <figure class="testimonial">
          <div class="testimonial__stars" aria-label="Rated 5 out of 5 stars">
            <span aria-hidden="true">★★★★★</span>
          </div>
          <blockquote class="testimonial__quote">&ldquo;{{ review.quote }}&rdquo;</blockquote>
          <figcaption class="testimonial__author">Verified Google review</figcaption>
        </figure>
      }
    }
  </div>

  <button
    type="button"
    class="carousel__arrow carousel__arrow--next"
    aria-label="Next review"
    (click)="next()"
  >
    ›
  </button>
</div>

@if (reviews.length > 1) {
  <div class="carousel__dots" role="tablist" aria-label="Choose a review">
    @for (review of reviews; track review.quote; let i = $index) {
      <button
        type="button"
        role="tab"
        class="carousel__dot"
        [class.carousel__dot--active]="i === activeIndex"
        [attr.aria-selected]="i === activeIndex"
        [attr.aria-label]="'Show review ' + (i + 1) + ' of ' + reviews.length"
        (click)="goTo(i)"
      ></button>
    }
  </div>
}
