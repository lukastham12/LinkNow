<a class="case-card" [class.case-card--compact]="compact" [routerLink]="link">
  <img class="case-card__img" [src]="photo.src" [alt]="photo.alt" loading="lazy" />
  <span class="case-card__label">
    {{ label }}
    <svg class="case-card__arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M7 17L17 7M17 7H9M17 7V15"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
    </svg>
  </span>
</a>
