<header class="header">
  <div class="header__inner">
    <a class="header__brand" routerLink="/" aria-label="LinkNow Events Co. — home" (click)="closeMenu()">
      <img class="header__logo" src="/brand/logo.jpg" alt="LinkNow Events Co." width="48" height="48" />
    </a>

    <button
      type="button"
      class="header__toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >
      <span class="header__toggle-bar" aria-hidden="true"></span>
      <span class="header__toggle-bar" aria-hidden="true"></span>
      <span class="header__toggle-bar" aria-hidden="true"></span>
    </button>

    <nav id="primary-nav" class="header__nav" [class.header__nav--open]="menuOpen()" aria-label="Primary">
      @for (link of navLinks; track link.path) {
        @if (link.children) {
          <div
            #item
            class="header__item"
            (mouseenter)="openDropdownFor(link.label)"
            (mouseleave)="closeDropdown()"
            (focusin)="openDropdownFor(link.label)"
            (focusout)="onItemFocusOut($event, item)"
          >
            <div class="header__item-row">
              <a
                class="header__link"
                [routerLink]="link.path"
                routerLinkActive="header__link--active"
                (click)="closeMenu()"
                (keydown.escape)="closeDropdown()"
                >{{ link.label }}</a
              >
              <button
                type="button"
                class="header__caret"
                aria-haspopup="true"
                [attr.aria-expanded]="isDropdownOpen(link.label)"
                [attr.aria-controls]="link.label + '-submenu'"
                [attr.aria-label]="
                  (isDropdownOpen(link.label) ? 'Collapse ' : 'Expand ') + link.label + ' menu'
                "
                (click)="toggleDropdown(link.label)"
                (keydown.escape)="closeDropdown()"
              >
                <span class="header__caret-icon" aria-hidden="true"></span>
              </button>
            </div>

            <ul
              class="submenu"
              [id]="link.label + '-submenu'"
              [class.submenu--open]="isDropdownOpen(link.label)"
            >
              @for (child of link.children; track child.path + (child.fragment ?? '')) {
                <li class="submenu__item">
                  <a
                    class="submenu__link"
                    [routerLink]="child.path"
                    [fragment]="child.fragment"
                    routerLinkActive="submenu__link--active"
                    (click)="closeMenu()"
                    (keydown.escape)="closeDropdown()"
                    >{{ child.label }}</a
                  >
                </li>
              }
            </ul>
          </div>
        } @else {
          <a
            class="header__link"
            [routerLink]="link.path"
            routerLinkActive="header__link--active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            (click)="closeMenu()"
            >{{ link.label }}</a
          >
        }
      }
    </nav>
  </div>
</header>
